name: Docker Publish

on:
  push:
    branches:
      - dev
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        shell: bash
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail

          image_lower="$(echo "${IMAGE}" | tr '[:upper:]' '[:lower:]')"
          sha_short="${GITHUB_SHA::7}"
          tags=("${image_lower}:sha-${sha_short}")

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tags+=("${image_lower}:${GITHUB_REF_NAME}")
          fi

          if [[ "${GITHUB_REF_TYPE}" == "branch" && "${GITHUB_REF_NAME}" == "dev" ]]; then
            tags+=("${image_lower}:dev")
            tags+=("${image_lower}:latest")
          fi

          {
            echo "tags<<EOF"
            printf "%s\n" "${tags[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build WebUI
        working-directory: ./RecStatus-web
        run: |
          npm ci
          npm run build
          rm -rf ../RecStatus/web/*
          mkdir -p ../RecStatus/web
          cp -r dist/* ../RecStatus/web/

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
