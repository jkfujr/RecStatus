# .github/workflows/release.yml
name: Release Drafter

on:
  push:
    branches:
      - dev
  
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  update_release_draft:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@v6
        with:
          GITHUB_TOKEN : ${{ secrets.ACCESS_TOKEN }}
